[sources]
# The suite calls the `verified_cholesky(Float64, A; precision_bits)` of BallArithmetic 0.4, which
# is not registered: the registry stops at 0.3.0, whose `verified_cholesky` takes no leading
# arithmetic argument, so a resolver left to the registry picks a version the Chebyshev basis
# cannot call.  `[sources]` is read from the project that is active, and for `Pkg.test` that is
# this one, so the entry belongs here and not in the top-level project, which must stay free of
# it to remain registrable.  Remove it once 0.4 is in the General registry and the compat bound
# in the top-level project can be narrowed to "0.4".
BallArithmetic = {url = "https://github.com/JuliaBallArithmetic/BallArithmetic.jl.git", rev = "main"}
